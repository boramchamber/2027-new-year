<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보람챔버 신년음악회</title>
<meta name="description" content="2027년 1월 6일(수) · 보람챔버오케스트라 신년음악회에 초대합니다.">
<!-- 카카오톡·문자 미리보기 (내용이 바뀌면 여기도 함께 고칩니다) -->
<meta property="og:type" content="website">
<meta property="og:title" content="보람챔버 신년음악회">
<meta property="og:description" content="2027년 1월 6일(수) · 보람챔버오케스트라가 초대합니다.">
<meta property="og:url" content="https://boramchamber.github.io/2027-new-year/">
<meta property="og:image" content="https://boramchamber.github.io/2027-new-year/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#4e2843">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #7b2d3b;
    --wine-deep: #4d1c2a;
    --gold: #c08a3e;
    --gold-soft: #f3d9a4;
    --ink: #3a2e28;
    --text: #5a4a40;
    --muted: #8b7b6d;
    --line: #ecdfcb;
    --paper: #fffaf2;
    --cream: #f8eedd;
    --outside: #efe4d3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--outside);
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    box-shadow: 0 0 30px rgba(90, 50, 30, .10);
    overflow: hidden;
  }
  .serif { font-family: 'Gowun Batang', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif; }
  .en { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; }

  /* 표지 */
  .cover {
    position: relative;
    background: linear-gradient(180deg, #2b1d38 0%, #4e2843 32%, #8e4556 56%, #d98466 78%, #f3bf86 100%);
    color: #fff;
    text-align: center;
    padding: 64px 24px 0;
  }
  .cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cover > *:not(canvas) { position: relative; }
  .cover .eyebrow { font-size: 17px; letter-spacing: .14em; color: var(--gold-soft); }
  .cover h1 { margin-top: 18px; font-size: 40px; line-height: 1.3; font-weight: 700; }
  .cover h1 .small { display: block; font-size: 19px; font-weight: 400; color: var(--gold-soft); letter-spacing: .1em; margin-bottom: 4px; }
  .cover .tagline { margin-top: 14px; font-size: 16px; color: rgba(255,255,255,.88); }
  .cover .when {
    display: inline-block; margin-top: 26px; padding: 10px 22px;
    border-top: 1px solid rgba(243,217,164,.6); border-bottom: 1px solid rgba(243,217,164,.6);
    font-size: 19px; letter-spacing: .04em;
  }
  .cover .when .time { display: block; font-size: 15px; color: var(--gold-soft); }
  .dday {
    display: inline-block; margin-top: 18px; padding: 4px 14px;
    background: rgba(255,255,255,.16); border-radius: 999px;
    color: #fff; font-size: 13px; letter-spacing: .08em;
  }
  .cover .scene { display: block; width: calc(100% + 48px); margin: 20px -24px -1px; }
  .cover .scene svg { display: block; width: 100%; height: auto; }

  /* 본문 섹션 */
  section { padding: 52px 24px; }
  .sec-label { text-align: center; font-size: 17px; color: var(--gold); letter-spacing: .06em; }
  .sec-title { text-align: center; font-size: 24px; font-weight: 700; margin: 2px 0 26px; color: var(--wine-deep); }

  .greeting { text-align: center; padding-top: 36px; }
  .greeting .sprig { width: 120px; height: 46px; margin: 0 auto 14px; display: block; }
  .greeting p { font-size: 16px; line-height: 2.05; color: var(--text); }
  .greeting .sign { margin-top: 22px; font-size: 15px; color: var(--muted); }

  .welcome { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 34px; }
  .welcome .w {
    background: var(--cream); border-radius: 16px; padding: 16px 6px 14px; text-align: center;
    font-size: 13px; line-height: 1.5; color: var(--ink);
  }
  .welcome .w svg { width: 34px; height: 34px; display: block; margin: 0 auto 8px; }
  .welcome .w b { display: block; font-size: 14px; color: var(--wine); }

  .soft { background: var(--cream); }
  .info { background: #fff; border-radius: 18px; padding: 6px 18px; box-shadow: 0 4px 16px rgba(122,62,40,.08); }
  .info .row { display: flex; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
  .info .row:last-child { border-bottom: 0; }
  .info .k { flex: 0 0 48px; color: var(--gold); font-size: 15px; font-weight: 500; }
  .info .v { flex: 1; font-weight: 500; }
  .info .v .sub { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
  .info .v.pending { color: var(--muted); font-weight: 400; }

  /* 프로그램 */
  .group { text-align: center; margin: 6px 0 18px; }
  .group + .pieces { margin-bottom: 8px; }
  .pieces + .group { margin-top: 40px; }
  .group .g-en { font-size: 16px; color: var(--gold); }
  .group h3 { font-size: 20px; color: var(--wine-deep); display: flex; align-items: center; gap: 12px; }
  .group h3::before, .group h3::after { content: ''; flex: 1; height: 1px; background: var(--gold); opacity: .45; }
  .group p { font-size: 14px; color: var(--muted); margin-top: 2px; }

  .piece {
    background: #fff; border-radius: 18px; overflow: hidden; margin-bottom: 18px;
    box-shadow: 0 6px 20px rgba(122,62,40,.10);
  }
  .piece .art { position: relative; aspect-ratio: 320 / 150; background: var(--cream); }
  .piece .art svg { display: block; width: 100%; height: 100%; }
  .piece .no {
    position: absolute; left: 12px; top: 12px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,250,242,.92); color: var(--wine); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .piece .body { padding: 16px 18px 20px; }
  .piece .t { font-size: 19px; font-weight: 700; color: var(--wine-deep); line-height: 1.35; }
  .piece .m { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .piece .d { font-size: 15px; color: var(--text); line-height: 1.75; margin-top: 10px; }
  .program-note { margin-top: 8px; text-align: center; font-size: 14px; color: var(--muted); }

  /* 지휘 */
  .conductor { text-align: center; }
  .conductor .baton { width: 64px; height: 64px; margin: 0 auto 10px; display: block; }
  .conductor .photo {
    width: 220px; margin: 0 auto 22px; padding: 8px; background: #fff;
    border-radius: 130px 130px 18px 18px; box-shadow: 0 10px 28px rgba(77,28,42,.18);
  }
  .conductor .photo img {
    display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 22%;
    border-radius: 122px 122px 12px 12px;
  }
  .conductor .role { font-size: 14px; color: var(--gold); letter-spacing: .3em; padding-left: .3em; }
  .conductor .name { font-size: 28px; font-weight: 700; color: var(--wine-deep); letter-spacing: .18em; padding-left: .18em; }
  .conductor .now { margin-top: 8px; font-size: 14px; color: var(--text); line-height: 1.8; }
  .conductor .profile {
    margin: 24px auto 0; padding: 6px 18px; text-align: left;
    background: #fff; border-radius: 18px; box-shadow: 0 4px 16px rgba(122,62,40,.08);
  }
  .conductor .pg { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .conductor .pg:last-child { border-bottom: 0; }
  .conductor .pg h4 { font-size: 14px; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  .conductor .pg ul { list-style: none; }
  .conductor .pg li { position: relative; padding-left: 12px; font-size: 14px; color: var(--text); line-height: 1.75; }
  .conductor .pg li::before { content: ''; position: absolute; left: 0; top: .78em; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }

  .performers { display: grid; gap: 12px; margin-top: 24px; }
  .performers .p { display: flex; justify-content: center; gap: 12px; font-size: 16px; }
  .performers .role { color: var(--muted); }
  .performers .name { font-weight: 600; color: var(--wine-deep); }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 50px; padding: 10px 14px;
    border: 1px solid var(--wine); border-radius: 999px;
    background: #fff; color: var(--wine);
    font: inherit; font-size: 15px; font-weight: 500; text-decoration: none; cursor: pointer;
  }
  .btn.primary { background: var(--wine); color: #fff; box-shadow: 0 6px 16px rgba(123,45,59,.25); }
  .btn.full { grid-column: 1 / -1; }
  .addr { text-align: center; }
  .addr .name { font-size: 18px; font-weight: 600; color: var(--wine-deep); }
  .addr .line { color: var(--text); margin-top: 4px; }
  .addr .parking { margin-top: 12px; font-size: 14px; color: var(--muted); }

  footer {
    padding: 48px 24px 56px; text-align: center;
    background: linear-gradient(180deg, var(--paper) 0%, #f6e3c8 100%);
  }
  footer .closing { font-size: 20px; color: var(--wine-deep); line-height: 1.6; }
  footer .closing small { display: block; font-size: 14px; color: var(--muted); font-family: 'Noto Sans KR', sans-serif; margin-top: 6px; }
  footer .contact { font-size: 14px; color: var(--muted); margin-top: 18px; }
  footer .copy { margin-top: 28px; font-size: 12px; color: #a89886; letter-spacing: .08em; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
    background: rgba(77,28,42,.94); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }
  [hidden] { display: none !important; }

  /* 작은 폰 (갤럭시 폴드 접힘·아이폰 SE 등 360px 이하) */
  @media (max-width: 360px) {
    section { padding: 44px 16px; }
    footer { padding: 40px 16px 48px; }
    .cover { padding: 52px 16px 0; }
    .cover .scene { width: calc(100% + 32px); margin: 18px -16px -1px; }
    .cover h1 { font-size: 34px; }
    .greeting p { font-size: 15px; }
    .welcome { gap: 6px; }
    .welcome .w { font-size: 12px; }
    .piece .t { font-size: 17px; }
    .piece .d { font-size: 14px; }
  }
</style>
</head>
<body>
<main class="page">

  <header class="cover">
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="eyebrow en" id="subtitle"></div>
    <h1 class="serif" id="title"></h1>
    <p class="tagline serif">새해, 음악으로 따뜻하게 만나요</p>
    <div class="when serif" id="when"></div>
    <div><span class="dday" id="dday" hidden></span></div>
    <div class="scene" id="cover-art"></div>
  </header>

  <section class="greeting reveal" id="sec-greeting">
    <!-- 새해 매화 가지 -->
    <svg class="sprig" viewBox="0 0 120 46" aria-hidden="true">
      <path d="M6 38 Q40 30 62 22 Q86 14 114 12" fill="none" stroke="#6b3b2a" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 26 Q56 36 54 42 M84 16 Q92 8 98 6" fill="none" stroke="#6b3b2a" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="#e98a9a"><circle cx="30" cy="30" r="4"/><circle cx="25" cy="27" r="3.4"/><circle cx="34" cy="26" r="3.4"/><circle cx="27" cy="34" r="3.4"/><circle cx="34" cy="34" r="3.4"/></g>
      <circle cx="30" cy="30" r="1.6" fill="#f6d27a"/>
      <g fill="#f0a6b2"><circle cx="70" cy="18" r="3"/><circle cx="66" cy="16" r="2.6"/><circle cx="73" cy="14" r="2.6"/><circle cx="67" cy="21" r="2.6"/><circle cx="73" cy="21" r="2.6"/></g>
      <circle cx="70" cy="18" r="1.2" fill="#f6d27a"/>
      <circle cx="54" cy="42" r="3" fill="#e98a9a"/><circle cx="99" cy="6" r="2.6" fill="#f0a6b2"/><circle cx="108" cy="12" r="2" fill="#e98a9a"/>
    </svg>
    <div class="sec-label en">Invitation</div>
    <h2 class="sec-title serif">초대합니다</h2>
    <div id="greeting"></div>

    <div class="welcome">
      <div class="w">
        <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M5 10 h24 v4 a3 3 0 0 0 0 6 v4 h-24 v-4 a3 3 0 0 0 0 -6Z" fill="#f3d9a4" stroke="#c08a3e" stroke-width="1.4"/><path d="M21 10 v14" stroke="#c08a3e" stroke-dasharray="2 2"/></svg>
        <b id="w-admission">입장 무료</b>편하게 오세요
      </div>
      <div class="w">
        <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M13 24 V8 l14 -3 v16" fill="none" stroke="#7b2d3b" stroke-width="2"/><ellipse cx="10" cy="24" rx="4" ry="3" fill="#7b2d3b"/><ellipse cx="24" cy="21" rx="4" ry="3" fill="#7b2d3b"/></svg>
        <b>영화음악·클래식</b>귀에 익은 곡들
      </div>
      <div class="w">
        <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 11 C14 5 5 6 6 13 C7 19 17 25 17 28 C17 25 27 19 28 13 C29 6 20 5 17 11Z" fill="#e2495b"/></svg>
        <b>누구나 환영</b>가족·친구와 함께
      </div>
    </div>
  </section>

  <section class="soft reveal">
    <div class="sec-label en">Information</div>
    <h2 class="sec-title serif">공연 안내</h2>
    <div class="info" id="info"></div>
  </section>

  <section class="reveal" id="sec-program">
    <div class="sec-label en">Program</div>
    <h2 class="sec-title serif">이런 곡을 들려드려요</h2>
    <div id="program"></div>
    <p class="program-note" id="program-note"></p>
  </section>

  <section class="soft reveal" id="sec-conductor" hidden>
    <div class="sec-label en">Conductor</div>
    <h2 class="sec-title serif">지휘자 소개</h2>
    <div class="conductor">
      <div class="photo" id="conductor-photo" hidden></div>
      <svg class="baton" id="conductor-baton" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#fff" stroke="#ecdfcb"/>
        <path d="M18 46 L44 20" stroke="#4d1c2a" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M16 48 L22 42" stroke="#c08a3e" stroke-width="5" stroke-linecap="round"/>
        <path d="M46 14 q3 4 0 8 M50 18 q3 4 0 8" fill="none" stroke="#c08a3e" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="role">지휘</div>
      <div class="name serif" id="conductor-name"></div>
      <div class="now" id="conductor-now" hidden></div>
      <div class="profile" id="conductor-profile" hidden></div>
    </div>
    <div class="performers" id="performers" hidden></div>
  </section>

  <section class="reveal" id="sec-map" hidden>
    <div class="sec-label en">Location</div>
    <h2 class="sec-title serif">오시는 길</h2>
    <div class="addr" id="addr"></div>
    <div class="btns">
      <a class="btn" id="naver" target="_blank" rel="noopener">네이버 지도</a>
      <a class="btn" id="kakao" target="_blank" rel="noopener">카카오맵</a>
      <button class="btn full" type="button" id="copy-addr">주소 복사</button>
    </div>
  </section>

  <footer>
    <p class="closing serif">새해 첫 음악회에서 뵙겠습니다<small id="closing-date"></small></p>
    <p class="contact" id="contact" hidden></p>
    <div class="btns">
      <button class="btn primary full" type="button" id="share">초대장 공유하기</button>
      <button class="btn full" type="button" id="calendar" hidden>내 캘린더에 추가</button>
    </div>
    <p class="copy" id="copyright"></p>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="art.js"></script>
<script>
(function () {
  var D = window.INVITE, ART = window.ART || {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  var p = D.date.split('-').map(Number);
  var day = new Date(p[0], p[1] - 1, p[2]);
  var dateText = p[0] + '년 ' + p[1] + '월 ' + p[2] + '일 (' + WEEK[day.getDay()] + ')';
  var dateShort = p[0] + '. ' + p[1] + '. ' + p[2] + '. ' + WEEK[day.getDay()] + '요일';
  var timeText = function (t) {
    if (!t) return '';
    var hm = t.split(':').map(Number), h = hm[0], m = hm[1] || 0;
    return (h < 12 ? '오전 ' : '오후 ') + (h % 12 === 0 ? 12 : h % 12) + '시' + (m ? ' ' + m + '분' : '');
  };

  // 표지
  $('subtitle').textContent = D.subtitle;
  var t = D.title.split(' ');
  $('title').innerHTML = t.length > 1
    ? '<span class="small">' + esc(t.slice(0, -1).join(' ')) + '</span>' + esc(t[t.length - 1])
    : esc(D.title);
  $('when').innerHTML = esc(dateShort) + (D.time ? '<span class="time">' + esc(timeText(D.time)) + '</span>' : '');
  $('cover-art').innerHTML = ART.cover || '';

  // D-day
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var diff = Math.round((day - today) / 86400000);
  if (diff >= 0) {
    $('dday').textContent = diff === 0 ? '오늘 공연합니다' : 'D-' + diff;
    $('dday').hidden = false;
  }

  // 인사말
  if (D.greeting && D.greeting.length) {
    $('greeting').innerHTML = '<p>' + D.greeting.map(esc).join('<br>') + '</p>' +
      '<p class="sign">' + esc(D.orchestra) + ' 드림</p>';
  }
  if (D.admission) $('w-admission').textContent = '입장 ' + D.admission;

  // 공연 안내
  var rows = [];
  var when = esc(dateText) + (D.time ? ' ' + esc(timeText(D.time)) : '');
  rows.push(['일시', when + (D.doorsOpen ? '<span class="sub">' + esc(timeText(D.doorsOpen)) + ' 입장 시작</span>' : '')]);
  if (D.venue && D.venue.name) {
    rows.push(['장소', esc(D.venue.name) + (D.venue.address ? '<span class="sub">' + esc(D.venue.address) + '</span>' : '')]);
  } else {
    rows.push(['장소', '추후 안내 예정', 'pending']);
  }
  if (D.admission) rows.push(['입장', esc(D.admission)]);
  $('info').innerHTML = rows.map(function (r) {
    return '<div class="row"><div class="k">' + r[0] + '</div><div class="v' + (r[2] ? ' ' + r[2] : '') + '">' + r[1] + '</div></div>';
  }).join('');

  // 프로그램 — 묶음마다 1번부터
  var groups = (D.program || []).filter(function (g) { return g.pieces && g.pieces.length; });
  if (groups.length) {
    $('program').innerHTML = groups.map(function (g) {
      var head = g.group
        ? '<div class="group">' + (g.en ? '<div class="g-en en">' + esc(g.en) + '</div>' : '') +
          '<h3 class="serif">' + esc(g.group) + '</h3>' + (g.desc ? '<p>' + esc(g.desc) + '</p>' : '') + '</div>'
        : '';
      var items = g.pieces.map(function (s, i) {
        var no = (i + 1 < 10 ? '0' : '') + (i + 1);
        var meta = [s.note, s.composer].filter(Boolean).map(esc).join(' · ');
        return '<article class="piece">' +
          '<div class="art">' + (ART[s.art] || '') + '<span class="no en">' + no + '</span></div>' +
          '<div class="body"><h4 class="t serif">' + esc(s.title) + '</h4>' +
          (meta ? '<div class="m">' + meta + '</div>' : '') +
          (s.desc ? '<p class="d">' + esc(s.desc) + '</p>' : '') +
          '</div></article>';
      }).join('');
      return head + '<div class="pieces">' + items + '</div>';
    }).join('');
    $('program-note').textContent = D.programNote || '';
  } else {
    $('sec-program').hidden = true;
  }

  // 지휘자 — 사진·현재 직함·약력은 비어 있으면 숨김
  var C = D.conductor;
  if (C && C.name) {
    $('conductor-name').textContent = C.name;
    if (C.photo) {
      $('conductor-photo').innerHTML = '<img src="' + esc(C.photo) + '" alt="지휘자 ' + esc(C.name) + '">';
      $('conductor-photo').hidden = false;
      $('conductor-baton').style.display = 'none';
    }
    var now = (C.now || []).filter(Boolean);
    if (now.length) { $('conductor-now').innerHTML = now.map(esc).join('<br>'); $('conductor-now').hidden = false; }
    var prof = (C.profile || []).filter(function (g) { return g && (typeof g === 'string' || (g.items && g.items.length)); });
    if (prof.length) {
      $('conductor-profile').innerHTML = prof.map(function (g) {
        if (typeof g === 'string') g = { items: [g] };
        return '<div class="pg">' + (g.head ? '<h4>' + esc(g.head) + '</h4>' : '') +
          '<ul>' + g.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
      }).join('');
      $('conductor-profile').hidden = false;
    }
    $('sec-conductor').hidden = false;
  }

  // 함께하는 연주자
  if (D.performers && D.performers.length) {
    $('performers').innerHTML = D.performers.map(function (x) {
      return '<div class="p"><span class="role">' + esc(x.role) + '</span><span class="name">' + esc(x.name) + '</span></div>';
    }).join('');
    $('performers').hidden = false;
    $('sec-conductor').hidden = false;
  }

  // 오시는 길
  if (D.venue && D.venue.address) {
    var q = encodeURIComponent(D.venue.address);
    $('addr').innerHTML = '<div class="name">' + esc(D.venue.name || '') + '</div><div class="line">' + esc(D.venue.address) + '</div>' +
      (D.venue.parking ? '<div class="parking">' + esc(D.venue.parking) + '</div>' : '');
    $('naver').href = 'https://map.naver.com/p/search/' + q;
    $('kakao').href = 'https://map.kakao.com/link/search/' + q;
    $('copy-addr').onclick = function () { copy(D.venue.address, '주소를 복사했습니다'); };
    $('sec-map').hidden = false;
  }

  // 맺음 · 문의 · 저작
  $('closing-date').textContent = dateText + (D.time ? ' ' + timeText(D.time) : '');
  if (D.contact) { $('contact').textContent = D.contact; $('contact').hidden = false; }
  $('copyright').textContent = '© ' + p[0] + ' ' + D.orchestra;

  // 공유
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }
  function copy(text, msg) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(msg); } catch (e) { toast('복사하지 못했습니다'); }
      document.body.removeChild(ta);
    }
  }
  $('share').onclick = function () {
    var data = { title: D.title, text: dateText + ' · ' + D.orchestra + ' ' + D.title + '에 초대합니다.', url: location.href };
    if (navigator.share) { navigator.share(data).catch(function () {}); }
    else { copy(location.href, '초대장 주소를 복사했습니다'); }
  };

  // 캘린더 (.ics) — 시간이 정해지면 나타납니다
  if (D.time) {
    $('calendar').hidden = false;
    $('calendar').onclick = function () {
      var hm = D.time.split(':').map(Number);
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var start = '' + p[0] + pad(p[1]) + pad(p[2]) + 'T' + pad(hm[0]) + pad(hm[1] || 0) + '00';
      var endH = hm[0] + 2;
      var end = '' + p[0] + pad(p[1]) + pad(p[2]) + 'T' + pad(endH) + pad(hm[1] || 0) + '00';
      var loc = D.venue ? [D.venue.name, D.venue.address].filter(Boolean).join(' ') : '';
      var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//boramchamber//invite//KO', 'BEGIN:VEVENT',
        'UID:' + D.date + '@boramchamber.github.io', 'DTSTAMP:' + start, 'DTSTART;TZID=Asia/Seoul:' + start,
        'DTEND;TZID=Asia/Seoul:' + end, 'SUMMARY:' + D.title, loc ? 'LOCATION:' + loc : '', 'END:VEVENT', 'END:VCALENDAR']
        .filter(Boolean).join('\r\n');
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
      a.download = 'boramchamber-' + D.date + '.ics';
      a.click();
    };
  }

  // 스크롤하면 섹션이 부드럽게 나타남
  var secs = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    secs.forEach(function (s) { io.observe(s); });
  } else { secs.forEach(function (s) { s.classList.add('in'); }); }

  // 표지 눈송이
  var cv = $('snow'), ctx = cv.getContext && cv.getContext('2d');
  if (ctx && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var flakes = [], W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var size = function () { W = cv.offsetWidth; H = cv.offsetHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); window.addEventListener('resize', size);
    for (var i = 0; i < 36; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H * .7, r: Math.random() * 1.8 + .6, s: Math.random() * .4 + .15, w: Math.random() * Math.PI * 2 });
    (function tick() {
      ctx.clearRect(0, 0, W, H);
      flakes.forEach(function (f) {
        f.y += f.s; f.w += .01; f.x += Math.sin(f.w) * .2;
        if (f.y > H * .75) { f.y = -4; f.x = Math.random() * W; }
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,246,228,' + (.35 + f.r / 5) + ')'; ctx.fill();
      });
      requestAnimationFrame(tick);
    })();
  }
})();
</script>
</body>
</html>
